<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pweeter - Decentralized Twitter</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fafafa; color: #111; max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { font-size: 1.5rem; font-weight: bold; border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .compose-box { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #fff; }
    textarea { width: 100%; min-height: 80px; border: 1px solid #ccc; border-radius: 4px; padding: 10px; box-sizing: border-box; resize: vertical; margin-bottom: 10px; }
    .btn { background: #1da1f2; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #0c85d0; }
    .clearfix::after { content: ""; clear: both; display: table; }
    #timeline { display: flex; flex-direction: column; gap: 15px; }
    .tweet { border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fff; }
    .tweet .author { font-weight: bold; color: #1da1f2; margin-bottom: 5px; font-size: 0.9rem; }
    .tweet .content { white-space: pre-wrap; word-break: break-word; }
    #status { font-size: 0.8rem; color: #666; font-weight: normal; }
    .auth-banner { background: #ffeeba; border: 1px solid #ffeeba; padding: 10px; border-radius: 4px; margin-bottom: 20px; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <div class="auth-banner" id="authBanner">
    You are viewing offline. <button onclick="authenticateGithub()">Sign in with GitHub</button> to enable snapshot PRs.
  </div>

  <div class="header">
    Pweeter
    <span id="status">⏳ Instantiating Identity...</span>
  </div>

  <div class="compose-box">
    <textarea id="tweetInput" placeholder="What is happening?!"></textarea>
    <div class="clearfix">
      <button class="btn" id="postBtn" style="float: right;">Pweet</button>
    </div>
  </div>

  <div id="timeline">
    <!-- feed will load here -->
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
